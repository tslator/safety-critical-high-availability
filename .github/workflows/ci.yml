name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-gtest:
    name: Native CMake + GoogleTest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Report primary compiler version
        run: g++ --version
      - name: Configure, build, and test
        run: |
          cmake -S . -B build/gtest -G Ninja -DSAFETY_CRIT_TEST_FRAMEWORK=GoogleTest
          cmake --build build/gtest --parallel
          ctest --test-dir build/gtest --output-on-failure

  native-catch2:
    name: Native CMake + Catch2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Report primary compiler version
        run: g++ --version
      - name: Configure, build, and test
        run: |
          cmake -S . -B build/catch2 -G Ninja -DSAFETY_CRIT_TEST_FRAMEWORK=Catch2
          cmake --build build/catch2 --parallel
          ctest --test-dir build/catch2 --output-on-failure

  # Sanitizer coverage for first-party and test code. ASan+UBSan run together;
  # TSan is a separate combination (it cannot be combined with either).
  sanitizers:
    name: Sanitizers (${{ matrix.sanitize }}, ${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["ASan+UBSan", "TSan"]
        framework: [GoogleTest, Catch2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Report primary compiler version
        run: g++ --version
      - name: Configure, build, and test under ${{ matrix.sanitize }}
        shell: bash
        run: |
          case "${{ matrix.sanitize }}" in
            ASan+UBSan)
              export ASAN_OPTIONS=detect_leaks=1
              export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
              sanitizer_flags="-DSAFETY_CRIT_ENABLE_ASAN=ON -DSAFETY_CRIT_ENABLE_UBSAN=ON"
              ;;
            TSan)
              export TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1
              sanitizer_flags="-DSAFETY_CRIT_ENABLE_TSAN=ON"
              # TSan's fixed shadow-memory reservation collides with ASLR on
              # some hosts (FATAL: unexpected memory mapping at init, even for
              # trivial programs). Disabling ASLR for the whole toolchain is
              # inherited by test binaries run during discovery and by ctest.
              set -- setarch $(uname -m) --addr-no-randomize
              ;;
            *)
              echo "unknown sanitizer combination: ${{ matrix.sanitize }}" >&2
              exit 1
              ;;
          esac
          ${@} cmake -S . -B build/${{ matrix.framework }} -G Ninja \
            -DSAFETY_CRIT_TEST_FRAMEWORK=${{ matrix.framework }} \
            ${sanitizer_flags}
          ${@} cmake --build build/${{ matrix.framework }} --parallel
          ${@} ctest --test-dir build/${{ matrix.framework }} --output-on-failure

  agent-guidance-drift:
    name: AI guidance adapter drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify AGENTS.md and copilot-instructions.md match docs/ai-guidance/CORE.md
        run: ./scripts/sync-agent-guidance.sh --check

  docker-build:
    name: Container image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build image and validate runtime binary
        run: |
          docker build --pull --tag safety-critical-ha:phase0 .
          docker run --rm safety-critical-ha:phase0 --version

  # Supplementary verification (DEC-0008, T-0008): clean build + full ctest
  # with clang-14 from the digest-pinned verification container, sharing
  # libc/libstdc++ with the gcc-primary baseline. Verification evidence only;
  # not system validation and not a CORE.md Tier-1 safety gate.
  clang-verify:
    name: Clang verification (clang-14, pinned container)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build pinned clang-14 verification image
        run: |
          docker build -f containers/verification/Dockerfile.clang \
            --tag safety-critical-ha:verify-clang-14 .
      - name: Configure, build, and test with clang-verify preset
        run: |
          docker run --rm --workdir /workspace \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            safety-critical-ha:verify-clang-14 \
            bash -o pipefail -c "
              cmake --preset clang-verify &&
              cmake --build --preset clang-verify --parallel &&
              ctest --preset clang-verify 2>&1 | tee /workspace/build/clang-verify-ctest.log
            "
      - name: Upload CTest log on failure
        if: failure()
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4.3.4
        with:
          name: clang-verify-ctest-log
          path: build/clang-verify-ctest.log
          if-no-files-found: warn

  docker-compose-smoke:
    name: Compose runtime + failover smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate stack startup, failover, and cleanup
        run: |
          docker compose config --quiet
          docker compose build
          docker compose up --wait --no-build
          docker compose ps
          docker compose exec supervisor safety-critical-ha --version
          ./containers/compose/failover-smoke.sh
          docker compose down --volumes --remove-orphans
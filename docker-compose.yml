# Phase 4 supervisor topology (T-0021, DEC-0011 #4/#8):
#   - The supervisor is the only long-lived Compose service. It forks the
#     monitor and the hot A/B + standby C workers, so all processes share
#     one container, one /dev/shm namespace, and one runtime directory.
#   - Supervisor loss exits the container; `restart: unless-stopped`
#     (re-)establishes the whole topology on the next start.
#   - The `perturb` service remains available for Phase 5 fault-injection
#     scenarios under its opt-in profile.
services:
  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    image: safety-critical-ha:phase0
    labels:
      safety-critical.role: supervisor
    command:
      - supervisor
      - --runtime-ms
      - "0"
      - --region
      - /safety_crit_region
      - --pid-dir
      - /run/safety-critical-ha
      # T-0034 (DEC-0014 §4): consolidated structured event log (supervisor
      # witness events + worker lifecycle + monitor alerts/report).
      - --event-log
      - /run/safety-critical-ha/events.jsonl
    cpus: "1.5"
    mem_limit: 512m
    cap_add:
      - SYS_NICE
      - SYS_PTRACE
    shm_size: 64m
    # T-0021: makes this container's IPC namespace joinable so the
    # observability daemon can attach via `ipc: service:supervisor`.
    ipc: shareable
    restart: unless-stopped
    networks: [safety-ha]
    # T-0038: the runtime dir (pidfiles + events.jsonl) lives in a named
    # volume so the observability daemon can tail the consolidated event log.
    volumes:
      - ha-runtime:/run/safety-critical-ha
    healthcheck:
      # Health is defined by shared-memory + worker pidfile liveness rather
      # than a version probe: if any hot worker (or the standby) dies and
      # the supervisor has not replaced it, the healthcheck goes red.
      test:
        - CMD-SHELL
        - >-
          test -e /dev/shm/safety_crit_region
          && test -e /run/safety-critical-ha/safety_crit_worker_0.pid
          && test -e /run/safety-critical-ha/safety_crit_worker_1.pid
          && test -e /run/safety-critical-ha/safety_crit_worker_2.pid
          && kill -0 "$(cat /run/safety-critical-ha/safety_crit_worker_0.pid)"
          && kill -0 "$(cat /run/safety-critical-ha/safety_crit_worker_1.pid)"
          && kill -0 "$(cat /run/safety-critical-ha/safety_crit_worker_2.pid)"
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 10s

  # T-0021/T-0038: read-only observability plane. `ipc: service:supervisor`
  # puts this container in the supervisor's IPC namespace so /dev/shm is the
  # supervisor's /dev/shm: the daemon consumes the shared region and the
  # worker ring buffers with zero copies and no extra mount. A supervisor
  # restart replaces the tmpfs; the daemon sees the backing file vanish
  # (stat failure) and reports degraded on /health until the supervisor
  # re-creates the region.
  observability:
    build:
      context: .
      dockerfile: Dockerfile
    image: safety-critical-ha:phase0
    labels:
      safety-critical.role: observability
    command:
      - observability
      - --listen
      - "0.0.0.0:8080"
      - --region
      - /safety_crit_region
      - --event-log
      - /run/safety-critical-ha/events.jsonl
    ipc: service:supervisor
    depends_on:
      supervisor:
        condition: service_healthy
    volumes:
      - ha-runtime:/run/safety-critical-ha
    cpus: "0.25"
    mem_limit: 256m
    restart: unless-stopped
    ports:
      - "${OBSERVABILITY_PORT:-8080}:8080"
    networks: [safety-ha]
    healthcheck:
      # /health is 200 while the region is attached, identity verifies, and
      # all rings are owned; 503 (curl -f exits non-zero) otherwise.
      test:
        - CMD-SHELL
        - curl -fsS -m 2 http://127.0.0.1:8080/health > /dev/null
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  perturb:
    build:
      context: .
      dockerfile: Dockerfile
    image: safety-critical-ha:phase0
    profiles: ["perturb"]
    labels:
      safety-critical.role: perturb
    cpus: "0.5"
    mem_limit: 512m
    # T-0029: replaces the Phase 0 `sleep infinity` stub with the real
    # harness binary. The service is a keep-alive host for
    # `docker compose exec perturb safety-critical-ha perturb ...` driven by
    # the host-side scenario scripts; the version probe doubles as a
    # startup self-check. NEVER FOR PRODUCTION USE (DEC-0007 pattern).
    entrypoint: ["/bin/sh", "-c",
      "trap 'exit 0' TERM INT; safety-critical-ha --version; while :; do sleep 1; done"]
    cap_add:
      - SYS_NICE
      - SYS_PTRACE
    restart: "no"
    shm_size: 64m
    networks: [safety-ha]

networks:
  safety-ha:
    driver: bridge

volumes:
  ha-runtime:
